<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Learning Analytics & Decision Intelligence Platform — Institutional performance benchmarks and learner diagnostics.">
  <meta name="theme-color" content="#4f46e5">
  <title>Student Learning Analytics — Decision Intelligence</title>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheet (imports tokens.css & components.css) -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- Mobile Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- Sidebar Mount Point -->
    <aside id="sidebar-mount" class="app-sidebar" aria-label="Main Navigation"></aside>

    <!-- Main Content Wrapper -->
    <div class="app-main-wrapper">
      <!-- Top Header Mount Point -->
      <header id="header-mount" class="app-header" role="banner"></header>

      <!-- Dynamic Dashboard Canvas Mount Point -->
      <main id="content-mount" class="app-content-mount" role="main" aria-live="polite"></main>
    </div>

    <!-- Global Error Toast Notification Mount -->
    <div id="global-error-mount" aria-live="assertive"></div>
  </div>

  <!-- Main ES6 Application Coordinator -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
